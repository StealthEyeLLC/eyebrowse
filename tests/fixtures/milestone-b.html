<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>eyebrowse Milestone B Fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; }
    section { margin: 20px 0; }
    button, input { font: inherit; margin: 4px; padding: 8px 12px; }
  </style>
</head>
<body>
  <main>
    <h1>eyebrowse Milestone B Fixture</h1>
    <section aria-label="Form controls">
      <label for="name">Agent name</label>
      <input id="name" name="name" type="text" value="" autocomplete="off">
      <button id="copy" type="button">Copy name</button>
      <output id="copied" aria-live="polite"></output>
    </section>

    <section aria-label="Mutation controls">
      <button id="add" type="button">Add semantic item</button>
      <button id="rename" type="button">Rename add button</button>
      <div id="items"></div>
    </section>
  </main>

  <script>
    let count = 0;
    const name = document.getElementById('name');
    const copied = document.getElementById('copied');
    const add = document.getElementById('add');
    const items = document.getElementById('items');

    document.getElementById('copy').addEventListener('click', () => {
      copied.textContent = name.value;
    });

    add.addEventListener('click', () => {
      count += 1;
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = `Semantic item ${count}`;
      button.dataset.item = String(count);
      items.appendChild(button);
    });

    document.getElementById('rename').addEventListener('click', () => {
      add.textContent = add.textContent === 'Add semantic item' ? 'Add another semantic item' : 'Add semantic item';
    });
  </script>
</body>
</html>
